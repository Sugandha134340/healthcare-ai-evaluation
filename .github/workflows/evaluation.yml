name: Healthcare AI Evaluation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest -q

      - name: Run benchmark
        run: |
          python -m evaluation.benchmark

      - name: Run trajectory evaluation
        run: |
          python -m evaluation.trajectory

      - name: Run AI red-team evaluation
        run: |
          python red_team.py

      - name: Run quality gate
        run: |
          python -m evaluation.quality_gate

      - name: Run drift monitoring
        run: |
          python monitoring/drift.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-ai-evaluation-reports
          path: |
            reports/
          if-no-files-found: warn